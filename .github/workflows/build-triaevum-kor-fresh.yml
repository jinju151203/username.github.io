name: Build Fresh TriAevum KOR

on:
  push:
    paths:
      - ".freshbuild/triaevum_kor_fresh.py"
      - ".github/workflows/build-triaevum-kor-fresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install pyinstaller==6.16.0

      - name: Build clean standalone EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TriAevumKOR-Fresh .freshbuild/triaevum_kor_fresh.py

      - name: Run EXE self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\TriAevumKOR-Fresh.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "TriAevumKOR\TriAevumKOR-error.log"
            if (Test-Path $log) { Get-Content $log }
            throw "EXE self-test failed with exit code $($p.ExitCode)"
          }

      - name: Write README
        shell: pwsh
        run: |
          "TriAevumKOR Fresh - rebuilt from scratch" | Set-Content -Encoding UTF8 dist/README.txt
          "The EXE passed its Windows self-test before upload." | Add-Content -Encoding UTF8 dist/README.txt
          "KOR Title ID: 000400000008F800" | Add-Content -Encoding UTF8 dist/README.txt
          "KOR Product Code: CTR-P-AQEK" | Add-Content -Encoding UTF8 dist/README.txt
          "No ROM or Nintendo game data is included." | Add-Content -Encoding UTF8 dist/README.txt

      - name: Upload tested EXE
        uses: actions/upload-artifact@v4
        with:
          name: TriAevumKOR-Fresh-Windows-x64
          path: |
            dist/TriAevumKOR-Fresh.exe
            dist/README.txt
          if-no-files-found: error
